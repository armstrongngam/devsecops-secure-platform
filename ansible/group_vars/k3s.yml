---
# Ports k3s needs on top of the hardening baseline.
hardening_firewall_ports:
  - 6443/tcp   # Kubernetes API
  - 10250/tcp  # kubelet metrics
  - 8472/udp   # flannel VXLAN
  - 80/tcp     # Traefik ingress
  - 443/tcp    # Traefik ingress

k3s_version: ""        # empty = latest stable channel
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16
