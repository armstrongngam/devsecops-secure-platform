# Copy to hosts.ini and replace the IPs with your lab VMs.
# Matches the layout in docs/HOMELAB.md.

[lab]
rocky01     ansible_host=192.168.10.11

[mgmt]
mgmt01      ansible_host=192.168.10.10

[k3s_server]
k3s-cp01    ansible_host=192.168.10.21

[k3s_agent]
k3s-wk01    ansible_host=192.168.10.22

[k3s:children]
k3s_server
k3s_agent

[all:vars]
ansible_user=labadmin
ansible_ssh_private_key_file=~/.ssh/lab_ed25519
