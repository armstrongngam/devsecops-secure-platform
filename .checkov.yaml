# Checkov configuration for the CI "iac" gate.
# Every skip below is a deliberate, documented decision, not a silenced warning.
# Resource-specific skips live next to the resource as "#checkov:skip=" comments.
compact: true
quiet: true
skip-check:
  # Kustomize injects the namespace and the signed image digest at build time,
  # so the raw manifests intentionally have neither. Kyverno enforces both at
  # admission (disallow-latest-tag, verify-image-signatures).
  - CKV_K8S_14 # image tag fixed
  - CKV_K8S_43 # image by digest
  - CKV_K8S_21 # default namespace
