apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: secure-app
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
# CI rewrites this block with the signed image digest on every main build.
images:
  - name: secure-app
    newName: ghcr.io/yourgithubname/devsecops-secure-platform/secure-app
    newTag: latest
